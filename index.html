<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kphone</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
    color: #fff;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== Phone Container ===== */
  .phone {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: #0a0a0a;
  }

  /* ===== Screens ===== */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
  }
  .screen.active {
    display: flex;
  }

  /* ===== LOCK SCREEN ===== */
  #lockScreen {
    background: linear-gradient(160deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    justify-content: center;
    align-items: center;
    padding: 40px 30px;
  }

  .lock-icon {
    width: 80px;
    height: 80px;
    border: 3px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(88,166,255,0.3); }
    50% { box-shadow: 0 0 20px 10px rgba(88,166,255,0.1); }
  }

  .lock-icon svg {
    width: 36px;
    height: 36px;
    fill: rgba(255,255,255,0.6);
  }

  .lock-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 8px;
    color: #e6edf3;
  }

  .lock-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .password-dots {
    display: flex;
    gap: 14px;
    margin-bottom: 35px;
    height: 16px;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    transition: all 0.2s;
  }

  .dot.filled {
    background: #58a6ff;
    border-color: #58a6ff;
    box-shadow: 0 0 8px rgba(88,166,255,0.4);
  }

  .dot.error {
    border-color: #f85149;
    background: #f85149;
    box-shadow: 0 0 8px rgba(248,81,73,0.4);
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 280px;
  }

  .key {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #e6edf3;
    font-size: 28px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    place-self: center;
  }

  .key:active {
    background: rgba(255,255,255,0.15);
    transform: scale(0.92);
  }

  .key.fn {
    font-size: 14px;
    border: none;
    background: none;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
  }

  .key.fn:active {
    color: rgba(255,255,255,0.7);
    background: none;
  }

  .error-msg {
    color: #f85149;
    font-size: 13px;
    margin-top: 20px;
    height: 20px;
    transition: opacity 0.3s;
    opacity: 0;
  }
  .error-msg.show {
    opacity: 1;
  }

  /* ===== CHAT LIST SCREEN ===== */
  #chatListScreen {
    background: #0a0a0a;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px 4px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
  }

  .status-icons {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .status-icons svg {
    width: 16px;
    height: 16px;
    fill: rgba(255,255,255,0.7);
  }

  .list-header {
    padding: 12px 20px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .list-header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #e6edf3;
  }

  .header-icons {
    display: flex;
    gap: 18px;
  }

  .header-icons svg {
    width: 22px;
    height: 22px;
    fill: rgba(255,255,255,0.5);
  }

  .search-bar {
    margin: 0 16px 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-bar svg {
    width: 16px;
    height: 16px;
    fill: rgba(255,255,255,0.25);
    flex-shrink: 0;
  }

  .search-bar span {
    font-size: 14px;
    color: rgba(255,255,255,0.25);
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .chat-item {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    gap: 14px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .chat-item:active {
    background: rgba(255,255,255,0.05);
  }

  .chat-item::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 78px;
    right: 20px;
    height: 0.5px;
    background: rgba(255,255,255,0.06);
  }

  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    flex-shrink: 0;
    color: #fff;
  }

  .avatar.a { background: linear-gradient(135deg, #6e40c9, #8b5cf6); }
  .avatar.d { background: linear-gradient(135deg, #1f6feb, #58a6ff); }
  .avatar.b { background: linear-gradient(135deg, #238636, #3fb950); }
  .avatar.c { background: linear-gradient(135deg, #da3633, #f85149); }
  .avatar.e { background: linear-gradient(135deg, #d29922, #e3b341); }
  .avatar.f { background: linear-gradient(135deg, #bf4b8a, #db61a2); }
  .avatar.g { background: linear-gradient(135deg, #3d8b8b, #56d4d4); }
  .avatar.group { background: linear-gradient(135deg, #30363d, #484f58); font-size: 16px; }

  .chat-info {
    flex: 1;
    min-width: 0;
  }

  .chat-name {
    font-size: 16px;
    font-weight: 500;
    color: #e6edf3;
    margin-bottom: 3px;
  }

  .chat-preview {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .chat-preview .lock-sm {
    width: 12px;
    height: 12px;
    fill: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  .chat-meta {
    text-align: right;
    flex-shrink: 0;
  }

  .chat-time {
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    margin-bottom: 4px;
  }

  .unread-badge {
    background: #58a6ff;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    margin-left: auto;
    float: right;
  }

  /* Bottom Nav */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 24px;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    background: #0a0a0a;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }

  .nav-item svg {
    width: 24px;
    height: 24px;
    fill: rgba(255,255,255,0.3);
  }

  .nav-item.active svg {
    fill: #58a6ff;
  }

  .nav-item span {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
  }

  .nav-item.active span {
    color: #58a6ff;
  }

  /* ===== CHAT VIEW SCREEN ===== */
  #chatViewScreen {
    background: #0d1117;
  }

  .chat-header {
    display: flex;
    align-items: center;
    padding: 10px 12px 10px 6px;
    gap: 10px;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid rgba(255,255,255,0.06);
    padding-top: max(10px, env(safe-area-inset-top));
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    padding: 8px;
    color: #58a6ff;
    font-size: 14px;
    font-weight: 500;
  }

  .back-btn svg {
    width: 22px;
    height: 22px;
    fill: #58a6ff;
  }

  .chat-header-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
  }

  .chat-header-info {
    flex: 1;
  }

  .chat-header-name {
    font-size: 16px;
    font-weight: 600;
    color: #e6edf3;
  }

  .chat-header-status {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
  }

  .messages-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg-date-divider {
    text-align: center;
    margin: 10px 0;
  }

  .msg-date-divider span {
    background: rgba(255,255,255,0.06);
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }

  .message {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.45;
    position: relative;
    word-break: break-word;
  }

  .message .msg-time {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    margin-top: 4px;
    display: block;
  }

  .msg-sent {
    background: #1f6feb;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 6px;
  }

  .msg-sent .msg-time {
    text-align: right;
    color: rgba(255,255,255,0.45);
  }

  .msg-received {
    background: rgba(255,255,255,0.08);
    color: #e6edf3;
    align-self: flex-start;
    border-bottom-left-radius: 6px;
  }

  .msg-encrypted {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.03);
    border: 1px dashed rgba(255,255,255,0.08);
  }

  .msg-encrypted.sent {
    align-self: flex-end;
    border-bottom-right-radius: 6px;
  }

  .msg-encrypted.received {
    align-self: flex-start;
    border-bottom-left-radius: 6px;
  }

  .msg-encrypted svg {
    width: 14px;
    height: 14px;
    fill: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  .chat-input-bar {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 8px;
    background: rgba(10,10,10,0.95);
    border-top: 0.5px solid rgba(255,255,255,0.06);
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  .chat-input-bar .input-field {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: #e6edf3;
    font-size: 15px;
    outline: none;
  }

  .chat-input-bar .input-field::placeholder {
    color: rgba(255,255,255,0.2);
  }

  .chat-input-bar .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #1f6feb;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0.4;
  }

  .chat-input-bar .send-btn svg {
    width: 18px;
    height: 18px;
    fill: #fff;
  }

  /* ===== NO PERMISSION MODAL ===== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    animation: fadeIn 0.2s;
  }

  .modal-overlay.show {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-box {
    background: #1c2128;
    border-radius: 16px;
    padding: 30px 28px 24px;
    text-align: center;
    max-width: 300px;
    width: 85%;
    animation: popIn 0.25s;
    border: 0.5px solid rgba(255,255,255,0.08);
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(248,81,73,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .modal-icon svg {
    width: 28px;
    height: 28px;
    fill: #f85149;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 600;
    color: #e6edf3;
    margin-bottom: 8px;
  }

  .modal-desc {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 22px;
    line-height: 1.5;
  }

  .modal-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #58a6ff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .modal-btn:active {
    background: rgba(255,255,255,0.12);
  }

  /* ===== Encrypted Notice ===== */
  .encryption-notice {
    text-align: center;
    padding: 12px;
    margin: 4px 0;
  }

  .encryption-notice span {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .encryption-notice svg {
    width: 12px;
    height: 12px;
    fill: rgba(255,255,255,0.2);
  }

  /* ===== Read receipt ===== */
  .read-receipt {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: right;
    margin-top: 2px;
  }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar {
    width: 0;
  }
</style>
</head>
<body>

<div class="phone">

  <!-- ===== LOCK SCREEN ===== -->
  <div class="screen active" id="lockScreen">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7v2H4v14h16V9h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>
    </div>
    <div class="lock-title">KPHONE</div>
    <div class="lock-subtitle">輸入密碼以解鎖</div>
    <div style="font-size:12px;color:rgba(255,255,255,0.25);margin-bottom:30px;letter-spacing:0.5px;">提示：密碼 = 屆數＋日期</div>
    <div class="password-dots" id="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div class="key fn" onclick="clearAll()">清除</div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div class="key fn" onclick="deleteKey()">⌫</div>
    </div>
    <div class="error-msg" id="errorMsg">密碼錯誤，請重新輸入</div>
  </div>

  <!-- ===== CHAT LIST SCREEN ===== -->
  <div class="screen" id="chatListScreen">
    <!-- Status Bar -->
    <div class="status-bar">
      <span id="statusTime">21:01</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.34C7 21.4 7.6 22 8.33 22h7.34c.73 0 1.33-.6 1.33-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- Header -->
    <div class="list-header">
      <h1>訊息</h1>
      <div class="header-icons">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>搜尋</span>
    </div>

    <!-- Chat List -->
    <div class="chat-list" id="chatList"></div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 5.69l5 4.5V18h-2v-6H9v6H7v-7.81l5-4.5M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
        <span>主頁</span>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
        <span>訊息</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>好友</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>設定</span>
      </div>
    </div>
  </div>

  <!-- ===== CHAT VIEW SCREEN ===== -->
  <div class="screen" id="chatViewScreen">
    <div class="chat-header">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </div>
      <div class="chat-header-avatar" id="chatAvatar"></div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatName"></div>
      </div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="chat-input-bar">
      <input type="text" class="input-field" placeholder="輸入訊息..." readonly>
      <button class="send-btn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== NO PERMISSION MODAL ===== -->
<div class="modal-overlay" id="permissionModal">
  <div class="modal-box">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7v2H4v14h16V9h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>
    </div>
    <div class="modal-title">您無此權限</div>
    <div class="modal-desc">此對話內容受到限制，<br>您目前沒有查看權限。</div>
    <button class="modal-btn" onclick="closeModal()">確認</button>
  </div>
</div>

<script>
// ===== DATA =====
const VALID_PASSWORDS = ['121003', '100312'];

const contacts = [
  { id: 'a', name: '牛萊', subtitle: '幹部', accessible: true, unread: 1, time: '21:51', avatarClass: 'a' },
  { id: 'd', name: '九面', subtitle: '幹部', accessible: true, unread: 1, time: '21:48', avatarClass: 'd' },
  { id: 'b', name: '洪姊', subtitle: '幹部', accessible: true, unread: 1, time: '21:35', avatarClass: 'b' },
  { id: 'group1', name: '幹部群組', subtitle: '10位成員', accessible: false, unread: 0, time: '20:30', avatarClass: 'group', isGroup: true },
  { id: 'c', name: '佳寧', subtitle: '幹部', accessible: false, unread: 0, time: '20:06', avatarClass: 'c' },
  { id: 'e', name: '杰哥', subtitle: '幹部', accessible: false, unread: 0, time: '18:03', avatarClass: 'e' },
  { id: 'group2', name: '活動討論區', subtitle: '8位成員', accessible: false, unread: 0, time: '18:00', avatarClass: 'group', isGroup: true },
  { id: 'f', name: 'Aden', subtitle: '幹部', accessible: false, unread: 3, time: '16:40', avatarClass: 'f' },
  { id: 'g', name: '統神', subtitle: '幹部', accessible: false, unread: 0, time: '15:20', avatarClass: 'g' },
  { id: 'group3', name: '庶務組', subtitle: '5位成員', accessible: false, unread: 0, time: '14:05', avatarClass: 'group', isGroup: true },
];

const chatData = {
  a: {
    name: '牛萊',
    avatarClass: 'a',
    messages: [
      { type: 'date', text: '10月3日' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'sent', text: '晚上22:20廢棄小街見', time: '21:48' },
    ]
  },
  d: {
    name: '九面',
    avatarClass: 'd',
    messages: [
      { type: 'date', text: '10月3日' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'sent', text: '晚上22:30來一下廢棄小街，我有東西要給你', time: '21:52' },
    ]
  },
  b: {
    name: '洪姊',
    avatarClass: 'b',
    inputText: '今晚過後，我就會全部都告訴你，再等我一下',
    messages: [
      { type: 'date', text: '10月3日' },
      { type: 'encrypted', side: 'sent' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'received' },
      { type: 'encrypted', side: 'sent' },
      { type: 'encrypted', side: 'received' },
    ]
  }
};

// ===== LOCK SCREEN =====
let password = '';
const dots = document.querySelectorAll('#dots .dot');
const errorMsg = document.getElementById('errorMsg');

function pressKey(num) {
  if (password.length >= 6) return;
  password += num;
  updateDots();

  if (password.length === 6) {
    setTimeout(checkPassword, 300);
  }
}

function deleteKey() {
  password = password.slice(0, -1);
  updateDots();
  errorMsg.classList.remove('show');
}

function clearAll() {
  password = '';
  updateDots();
  errorMsg.classList.remove('show');
}

function updateDots() {
  dots.forEach((dot, i) => {
    dot.classList.remove('filled', 'error');
    if (i < password.length) dot.classList.add('filled');
  });
}

function checkPassword() {
  if (VALID_PASSWORDS.includes(password)) {
    // Success
    document.getElementById('lockScreen').classList.remove('active');
    document.getElementById('chatListScreen').classList.add('active');
    updateStatusTime();
  } else {
    // Error
    dots.forEach(d => {
      d.classList.remove('filled');
      d.classList.add('error');
    });
    errorMsg.classList.add('show');
    setTimeout(() => {
      password = '';
      dots.forEach(d => d.classList.remove('error'));
    }, 600);
  }
}

// ===== STATUS TIME =====
function updateStatusTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}

// ===== CHAT LIST =====
function renderChatList() {
  const list = document.getElementById('chatList');
  const lockSvg = `<svg class="lock-sm" viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7v2H4v14h16V9h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>`;

  list.innerHTML = contacts.map(c => {
    const avatarLabel = c.isGroup ? '👥' : c.name;
    const previewText = c.accessible
      ? (c.id === 'a' ? 'K: 晚上22:20廢棄小街見'
        : c.id === 'd' ? 'K: 晚上22:30來一下廢棄小街...'
        : '<span style="color:#f85149">[ 草稿 ]</span> 今晚過後，我就會全部都告...')
      : `${lockSvg} 已加密的對話`;
    const badge = c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : '';

    return `
      <div class="chat-item" onclick="openChat('${c.id}', ${c.accessible})">
        <div class="avatar ${c.avatarClass}">${avatarLabel}</div>
        <div class="chat-info">
          <div class="chat-name">${c.name}</div>
          <div class="chat-preview">${previewText}</div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${c.time}</div>
          ${badge}
        </div>
      </div>
    `;
  }).join('');
}

// ===== OPEN CHAT =====
function openChat(id, accessible) {
  if (!accessible) {
    showPermissionModal();
    return;
  }

  const data = chatData[id];
  if (!data) return;

  // Set header
  document.getElementById('chatAvatar').className = `chat-header-avatar avatar ${data.avatarClass}`;
  document.getElementById('chatAvatar').textContent = data.name;
  document.getElementById('chatName').textContent = data.name;

  // Render messages
  const area = document.getElementById('messagesArea');
  const lockIcon = `<svg viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7v2H4v14h16V9h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v2H8V7c0-2.276 1.724-4 4-4zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>`;

  let html = `<div class="encryption-notice"><span>${lockIcon} 訊息與通話已加密保護</span></div>`;

  data.messages.forEach(msg => {
    if (msg.type === 'date') {
      html += `<div class="msg-date-divider"><span>${msg.text}</span></div>`;
    } else if (msg.type === 'encrypted') {
      html += `<div class="msg-encrypted ${msg.side}">${lockIcon} 已加密</div>`;
    } else if (msg.type === 'sent') {
      html += `
        <div class="message msg-sent">
          ${msg.text}
          <span class="msg-time">${msg.time}</span>
        </div>
        <div class="read-receipt">已讀</div>
      `;
    } else if (msg.type === 'received') {
      html += `
        <div class="message msg-received">
          ${msg.text}
          <span class="msg-time">${msg.time}</span>
        </div>
      `;
    }
  });

  area.innerHTML = html;

  // Set input field text if defined (e.g. B's unsent message)
  const inputField = document.querySelector('.chat-input-bar .input-field');
  const sendBtn = document.querySelector('.chat-input-bar .send-btn');
  if (data.inputText) {
    inputField.value = data.inputText;
    sendBtn.style.opacity = '1';
  } else {
    inputField.value = '';
    sendBtn.style.opacity = '0.4';
  }

  // Switch screen
  document.getElementById('chatListScreen').classList.remove('active');
  document.getElementById('chatViewScreen').classList.add('active');

  // Scroll to bottom
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

// ===== GO BACK =====
function goBack() {
  document.getElementById('chatViewScreen').classList.remove('active');
  document.getElementById('chatListScreen').classList.add('active');
}

// ===== PERMISSION MODAL =====
function showPermissionModal() {
  document.getElementById('permissionModal').classList.add('show');
}

function closeModal() {
  document.getElementById('permissionModal').classList.remove('show');
}

document.getElementById('permissionModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== INIT =====
renderChatList();
</script>

</body>
</html>
